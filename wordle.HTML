<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WORDLE</title>
        <link rel="stylesheet" href="wordle.css">
    </head>
    <body>
        <div class="header">
            <div class="actions">
            <button class="theme" title="Change Theme">Theme</button>
            <button class="difficulty">Select Mode</button>
            <button class="statistics">Statistics</button>
            <button class="new-game" onclick=newGame();>New Game</button>
            <button class="hint" title="Hints">?</button>
            </div>
        </div>
        <div class="game">

        <div class="guesses">
            <!-- .no-cursor {caret-color: transparent;} -->
        <div class="guess1">
            <input id="let1g1" class="inputfield inputfield1" type="text" maxlength="1">
            <input id="let2g1" class="inputfield inputfield1" type="text" maxlength="1">
            <input id="let3g1" class="inputfield inputfield1" type="text" maxlength="1">
            <input id="let4g1" class="inputfield inputfield1" type="text" maxlength="1">
            <input id="let5g1" class="inputfield inputfield1" type="text" maxlength="1">
        </div>
        <div class="guess2">
            <input id="let1g2" class ="inputfield inputfield2" type="text" maxlength="1">
            <input id="let2g2" class="inputfield inputfield2" type="text" maxlength="1">
            <input id="let3g2" class="inputfield inputfield2" type="text" maxlength="1">
            <input id="let4g2" class="inputfield inputfield2" type="text" maxlength="1">
            <input id="let5g2" class="inputfield inputfield2" type="text" maxlength="1">
        </div>
        <div class="guess3">
            <input id="let1g3" class="inputfield inputfield3" type="text" maxlength="1">
            <input id="let2g3" class="inputfield inputfield3"type="text" maxlength="1">
            <input id="let3g3" class="inputfield inputfield3"type="text" maxlength="1">
            <input id="let4g3" class="inputfield inputfield3"type="text" maxlength="1">
            <input id="let5g3" class="inputfield inputfield3"type="text" maxlength="1">
        </div>
        <div class="guess4">
            <input id="let1g4" class="inputfield inputfield4" type="text" maxlength="1">
            <input id="let2g4" class="inputfield inputfield4" type="text" maxlength="1">
            <input id="let3g4" class="inputfield inputfield4" type="text" maxlength="1">
            <input id="let4g4" class="inputfield inputfield4" type="text" maxlength="1">
            <input id="let5g4" class="inputfield inputfield4" type="text" maxlength="1">
        </div>
        <div class="guess5">
            <input id="let1g5" class="inputfield inputfield5" type="text" maxlength="1">
            <input id="let2g5" class="inputfield inputfield5"type="text" maxlength="1">
            <input id="let3g5" class="inputfield inputfield5"type="text" maxlength="1">
            <input id="let4g5" class="inputfield inputfield5"type="text" maxlength="1">
            <input id="let5g5" class="inputfield inputfield5"type="text" maxlength="1">
        </div>
        <div class="guess6">
            <input id="let1g6" class="inputfield inputfield6"type="text" maxlength="1">
            <input id="let2g6" class="inputfield inputfield6"type="text" maxlength="1">
            <input id="let3g6" class="inputfield inputfield6"type="text" maxlength="1">
            <input id="let4g6" class="inputfield inputfield6"type="text" maxlength="1">
            <input id="let5g6" class="inputfield inputfield6"type="text" maxlength="1">
        </div>
        </div>
    </br>
        </div>
        <div class="keyboard">
        <div class="key-row">
            <button class="key">Q</button>
            <button class="key">W</button>
            <button class="key">E</button>
            <button class="key">R</button>
            <button class="key">T</button>
            <button class="key">Y</button>
            <button class="key">U</button>
            <button class="key">I</button>
            <button class="key">O</button>
            <button class="key">P</button>
            </div>

            <div class="key-row">
            <button class="key">A</button>
            <button class="key">S</button>
            <button class="key">D</button>
            <button class="key">F</button>
            <button class="key">G</button>
            <button class="key">H</button>
            <button class="key">J</button>
            <button class="key">K</button>
            <button class="key">L</button>
            </div>

            <div class="key-row">
            <button class="backspace">←</button>
            <button class="key">Z</button>
            <button class="key">X</button>
            <button class="key">C</button>
            <button class="key">V</button>
            <button class="key">B</button>
            <button class="key">N</button>
            <button class="key">M</button>
            <button class="enter">Enter</button>
            </div>
        </div>
        </div>
        <br>
        <div class="footer">
            <footer>Made by Kero</footer>
        </div>
        





        <script src="wordle.js"></script>
    </body>
</html>
