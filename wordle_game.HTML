<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WORDLE</title>
        <link rel="stylesheet" href="styles/wordle_game.css">
    </head>
    <body>
        <div class="header">
            <div class="stats">
            <button class="theme" title="Change Theme">Theme</button>
            <button class="statistics">Statistics</button>
            </div>
            <div class="actions">
            <button class="difficulty" onclick="selectMode();">Select Mode</button>
            <button class="new-game" onclick="newGame();">New Game</button>
            <button class="hint" title="Hints" onclick="showHint();">?</button>
            </div>
        </div>
        <div class="game">

        <div class="guesses">
            <!-- .no-cursor {caret-color: transparent;} -->

            <!-- NEW: rows/inputs for this container are built dynamically by buildGrid() in wordle.js
                 based on config.numLetters / config.numGuesses. It replaces the old hardcoded
                 guess1..guess6 blocks so the grid size can change at runtime. -->
            <div class="standard-grid" id="guessesContainer"></div>

            <!--staircase-->
            <div class="staircase">
                <div class="box-row">
                <div class="box" id="row1"></div></div>
                <div class="box-row">
                <div class="box" id="row2"></div> <div class="box" id="row2"></div></div>
                <div class="box-row">
                <div class="box" id="row3"></div> <div class="box" id="row3"></div> <div class="box" id="row3"></div></div>
                <div class="box-row">
                <div class="box" id="row4"></div> <div class="box" id="row4"></div> <div class="box" id="row4"></div> <div class="box" id="row4"></div></div>
                <div class="box-row">
                <div class="box" id="row5"></div> <div class="box" id="row5"></div> <div class="box" id="row5"></div> <div class="box" id="row5"></div> <div class="box" id="row5"></div></div>
            </div>
            <div class="checkboard">
                <div class="row-3"><div class="checkbox"></div><div class="checkbox"></div><div class="checkbox"></div></div>
                <div class="row-2"><div class="checkbox"></div><div class="checkbox"></div></div>
                <div class="row-3"><div class="checkbox"></div><div class="checkbox"></div><div class="checkbox"></div></div>
                <div class="row-2"><div class="checkbox"></div><div class="checkbox"></div></div>
                <div class="row-3"><div class="checkbox"></div><div class="checkbox"></div><div class="checkbox"></div></div>
            </div>
        </div>
    </br>
        </div>
        <div class="keyboard">
        <div class="key-row">
            <button class="key keyQ">Q</button>
            <button class="key keyW">W</button>
            <button class="key keyE">E</button>
            <button class="key keyR">R</button>
            <button class="key keyT">T</button>
            <button class="key keyY">Y</button>
            <button class="key keyU">U</button>
            <button class="key keyI">I</button>
            <button class="key keyO">O</button>
            <button class="key keyP">P</button>
            </div>

            <div class="key-row">
            <button class="key keyA">A</button>
            <button class="key keyS">S</button>
            <button class="key keyD">D</button>
            <button class="key keyF">F</button>
            <button class="key keyG">G</button>
            <button class="key keyH">H</button>
            <button class="key keyJ">J</button>
            <button class="key keyK">K</button>
            <button class="key keyL">L</button>
            </div>

            <div class="key-row">
            <button class="backspace">←</button>
            <button class="key keyZ">Z</button>
            <button class="key keyX">X</button>
            <button class="key keyC">C</button>
            <button class="key keyV">V</button>
            <button class="key keyB">B</button>
            <button class="key keyN">N</button>
            <button class="key keyM">M</button>
            <button class="enter">Enter</button>
            </div>
        </div>
        </div>
        <br>
        <div class="footer">
            <footer>Made by Kero</footer>
        </div>
        
        <!--message container-->
        <div id="message"></div>

        <!--hint container-->
        <div class="hintDisplay">
            <div class="container">
                <p>Click for hints!</p>
                <div class="consonant">
                <a onclick="showConsonant();">Show consonant</a>
                </div>
                <div class="vowel">
                <a onclick="showVowel();">Show vowel</a>
                </div>
                <button onclick="closeHint();">Back to Wordle</button>
            </div>
        </div>

        <!--statistics container-->

        <!--modes container-->
        <div class="modedisplay">
            <div class="modecontainer">
                <p>Select a game mode!</p>
                <div class="staircaseoptn">
                    <button class="staircasebtn" onclick="ModeShape(1);">Staircase</button>
                </div>
                <div class="checkboardoptn">
                    <button class="checkboardbtn" onclick="ModeShape(2);">Checkboard</button>
                </div>
                <div class="superhardoptn">
                    <button class="superhardbtn" onclick="ModeShape(3);">Super Hard</button>
                </div>
                <div class="numoflettersoptn">
                    <!-- NEW: unique id (was duplicated "number" on both selects) -->
                    <label for="letterCount">Select Number of Letters:</label>
                    <select id="letterCount">
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5" selected>5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div class="numofguessesoptn">
                    <!-- NEW: unique id (was duplicated "number" on both selects) -->
                    <label for="guessCount">Select Number of Guesses:</label>
                    <select id="guessCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6" selected>6</option>
                    </select>
                </div>
                <!-- NEW: applies the selected letter/guess counts, rebuilds the grid, starts a new game -->
                <button class="applysettings" onclick="applyCustomSettings();">Apply &amp; Start</button>
                <a class="exit" onclick="ExitMode()">exit current mode?</a>
            </div>
        </div>

        


        <script src="javascript/words/words3.js"></script>
        <script src="javascript/words/words4.js"></script>
        <script src="javascript/words/words5.js"></script>
        <script src="javascript/words/words6.js"></script>
        <script src="javascript/words/words7.js"></script>
        <script src="javascript/words/words8.js"></script>
        <script src="javascript/words/words9.js"></script>
        <script src="javascript/words/words10.js"></script>
        <script src="javascript/wordle.js"></script>
        <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get("new") === "true") {
                window.history.replaceState({}, document.title, window.location.pathname);
                newGame();
            }
        };
        </script>
    </body>
</html>
